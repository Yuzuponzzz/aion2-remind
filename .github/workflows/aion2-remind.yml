name: AION2 Remind

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: "Discordへテスト投稿する"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
    paths:
      - "aion2_remind.py"
      - ".github/workflows/aion2-remind.yml"

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: aion2-remind
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send Discord test message
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.send_test) }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python aion2_remind.py --test

      - name: Check AION2 news
        if: ${{ github.event_name != 'push' && !(github.event_name == 'workflow_dispatch' && inputs.send_test) }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python aion2_remind.py

      - name: Save article history
        if: ${{ github.event_name != 'push' && !(github.event_name == 'workflow_dispatch' && inputs.send_test) }}
        run: |
          if [ -f seen.json ]; then
            git config user.name "AION2 Remind Bot"
            git config user.email "actions@github.com"
            git add seen.json

            if ! git diff --cached --quiet; then
              git commit -m "Update AION2 news history"
              git push
            fi
          fi
